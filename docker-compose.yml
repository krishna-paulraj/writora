# Local full-stack dev: postgres + redis + rabbitmq + 3 apps.
#
# First-time setup:
#   cp apps/api/.env.example apps/api/.env  (fill in any secrets)
#   docker compose up -d --build
#   (migrations run automatically on api startup via `prisma migrate deploy`)
#
# Common commands:
#   docker compose logs -f api
#   docker compose restart api
#   docker compose down -v  (nukes data — careful)

services:
  postgres:
    # pgvector build: the blog-embeddings migration runs `CREATE EXTENSION
    # vector` (semantic related-posts + backlink matching), which stock
    # postgres images can't satisfy — the api would crash-loop on boot.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: writora
      POSTGRES_PASSWORD: writora
      POSTGRES_DB: writora
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writora"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://writora:writora@postgres:5432/writora
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SITE_URL: http://localhost:3000
      # Pass these from your shell or a .env at the repo root
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (no insecure default)}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID:-}
      GOOGLE_AUTH_SECRET_ID: ${GOOGLE_AUTH_SECRET_ID:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:4000/auth/google/callback}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Writora <onboarding@resend.dev>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      # Cross-app URLs + CORS (defaults match the compose port mappings)
      APP_URL: ${APP_URL:-http://localhost:3001}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # AI article generation (features 503 gracefully when unset)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # AI image generation (Recraft)
      RECRAFT_API_KEY: ${RECRAFT_API_KEY:-}
      RECRAFT_MODEL: ${RECRAFT_MODEL:-}
      RECRAFT_API_URL: ${RECRAFT_API_URL:-}
      # Keyword research (DataForSEO)
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      DATAFORSEO_LOCATION_CODE: ${DATAFORSEO_LOCATION_CODE:-}
      DATAFORSEO_LANGUAGE_CODE: ${DATAFORSEO_LANGUAGE_CODE:-}
      # CMS publish-out credential encryption (32-byte hex/base64 key)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Stripe billing (free tier works unkeyed)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      # External cron trigger (/internal/cron/tick) for sleep-prone hosts
      CRON_SECRET: ${CRON_SECRET:-}
      # Object storage — leave blank to use local disk in the api volume
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_ACL: ${S3_ACL:-}
    volumes:
      - api-uploads:/app/uploads
    # Uses node's global fetch (no curl/wget in the slim image). start_period
    # covers first-boot `prisma migrate deploy` before failures start counting.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  www:
    build:
      context: .
      dockerfile: apps/www/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WWW_URL: http://localhost:3000
        NEXT_PUBLIC_APP_URL: http://localhost:3001
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Used by middleware (proxy.ts) to verify the auth cookie
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (no insecure default)}
      # Contact-form delivery (form reports "not configured" when unset)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_WWW_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (no insecure default)}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  api-uploads:
